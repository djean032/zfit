[build-system]
requires = [
    "meson-python>=0.13.0",
    "cython>=3.0",
    "numpy>=1.20",
    "patchelf; sys_platform == 'linux'",
]
build-backend = "mesonpy"

[project]
name = "zscan-fit-intel"
version = "0.1.7"
description = "Z-scan fitting library for nonlinear optics (Intel oneAPI)"
authors = [{name = "Dairen Jean"}]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "scipy>=1.0"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* pp*"
build-frontend = "build"
test-command = "pytest {package}/test -v"
test-requires = ["pytest", "scipy"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.meson-python]
allow-windows-internal-shared-libs = true
