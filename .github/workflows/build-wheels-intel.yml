name: Build Wheels (Intel oneAPI)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-intel:
    name: Build (Linux, x86_64, Intel ifx)
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
       
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: x86_64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_MANYLINUX_IMAGE: ${{ vars.MANYLINUX_IMAGE || 'quay.io/pypa/manylinux_2_28_x86_64' }}
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_BEFORE_ALL_LINUX: |
            # Add Intel APT repository and install compilers in the manylinux container
            # manylinux_2_28 is Fedora-based, use dnf
            dnf install -y dnf-plugins-core gnupg
            # Add Intel GPG key and repo (works on RHEL/CentOS/Fedora)
            rpm --import https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
            dnf config-manager --add-repo https://apt.repos.intel.com/oneapi.repo
            dnf install -y --setopt=install_weak_deps=False intel-oneapi-compiler-fortran-2025.0 intel-oneapi-compiler-dpcpp-cpp-2025.0
          CIBW_ENVIRONMENT_LINUX: |
            FC=ifx
            CC=icx
            CXX=icpx
            PATH: /opt/intel/oneapi/compiler/2025.0/bin:/opt/intel/oneapi/mpi/2021.14/bin:$PATH
            LD_LIBRARY_PATH: /opt/intel/oneapi/compiler/2025.0/lib:/opt/intel/oneapi/mpi/2021.14/lib:$LD_LIBRARY_PATH
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair -w {dest_dir} {wheel}
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-intel
          path: wheelhouse/*.whl

  build-windows-intel:
    name: Build (Windows, x86_64, Intel ifx)
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Intel oneAPI
        shell: powershell
        run: |
          $url = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/0d61d48a-4fe8-4cb2-bd9d-94d2c19c6227/intel-oneapi-compiler-2025.3.0.563_offline.exe"
          Invoke-WebRequest -Uri $url -OutFile intel_oneapi.exe
          Start-Process -FilePath ".\intel_oneapi.exe" -ArgumentList "-s -a --silent --eula accept" -Wait
      
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: AMD64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_BEFORE_BUILD_WINDOWS: |
            call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
            pip install delvewheel
          CIBW_ENVIRONMENT_WINDOWS: FC=ifx
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64-intel
          path: wheelhouse/*.whl

  upload-pypi:
    name: Upload to PyPI
    needs: [build-linux-intel, build-windows-intel]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      
      - name: List wheels
        run: ls -la dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
