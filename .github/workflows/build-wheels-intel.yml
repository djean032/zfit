name: Build Wheels (Intel oneAPI)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-intel:
    name: Build (Linux, x86_64, Intel ifx)
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Add Intel APT repository
        run: |
          curl -sS -L https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
      
      - name: Install Intel oneAPI compilers
        run: sudo apt-get install --no-install-recommends intel-oneapi-compiler-fortran-2025.0 intel-oneapi-compiler-dpcpp-cpp-2025.0
      
      - name: Setup Intel oneAPI environment
        run: |
          source /opt/intel/oneapi/setvars.sh
          printenv >> $GITHUB_ENV
      
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: x86_64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_BEFORE_ALL_LINUX: |
            source /opt/intel/oneapi/setvars.sh
          CIBW_ENVIRONMENT_LINUX: FC=ifx CC=icx CXX=icpx
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-intel
          path: wheelhouse/*.whl

  build-windows-intel:
    name: Build (Windows, x86_64, Intel ifx)
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Intel oneAPI
        uses: rscohn2/setup-oneapi@main
        with:
          components: 'intel-oneapi-compilers'
      
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: AMD64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_BEFORE_BUILD_WINDOWS: |
            call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
            pip install delvewheel
          CIBW_ENVIRONMENT_WINDOWS: FC=ifx
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64-intel
          path: wheelhouse/*.whl

  upload-pypi:
    name: Upload to PyPI
    needs: [build-linux-intel, build-windows-intel]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      
      - name: List wheels
        run: ls -la dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
