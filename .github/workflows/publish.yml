name: Publish to PyPI

on:
  workflow_run:
    workflows: [Build Wheels, Build Wheels (Intel oneAPI)]
    types: [completed]
    branches: [master]
  push:
    tags: ['v*']

jobs:
  upload-pypi:
    name: Upload to PyPI
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      
      - name: List wheels
        run: ls -la dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
