name: Publish to PyPI

on:
  workflow_run:
    workflows: [Build Wheels, Build Wheels (Intel oneAPI)]
    types: [completed]
    branches: [master]

jobs:
  upload-pypi:
    name: Upload to PyPI
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
       
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
