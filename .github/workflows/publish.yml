name: Publish to PyPI

on:
  workflow_run:
    workflows: [Build Wheels, Build Wheels (Intel oneAPI)]
    types: [completed]
    branches: [master]

jobs:
  upload-pypi:
    name: Upload to PyPI
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Check for tag marker
        id: check-tag
        run: |
          if [ -d "dist/is-tag-push" ]; then
            echo "tag_push=true" >> $GITHUB_OUTPUT
          else
            echo "tag_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI
        if: steps.check-tag.outputs.tag_push == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
