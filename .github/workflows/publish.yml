name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  upload-pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List wheels
        run: find dist -name "*.whl"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
