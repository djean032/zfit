name: Publish to PyPI

on:
  push:
    tags: ['v*']

jobs:
  upload-pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Check for wheels
        id: check-wheels
        run: |
          count=$(find dist -name "*.whl" | wc -l)
          echo "wheel_count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -eq 0 ]; then
            echo "No wheels found, skipping publish"
            exit 1
          fi
          echo "Found $count wheels"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
