name: Publish to PyPI

on:
  workflow_run:
    workflows: [Build Wheels, Build Wheels (Intel oneAPI)]
    types: [completed]

jobs:
  publish-zscan-fit:
    name: Publish zscan-fit (gfortran)
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: wheels-zscan-fit-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-zscan-fit-intel:
    name: Publish zscan-fit-intel (Intel)
    needs: publish-zscan-fit
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: wheels-zscan-fit-intel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
