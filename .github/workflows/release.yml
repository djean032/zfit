name: Release

on:
  release:
    types: [published, created, edited]

jobs:
  # =====================
  # GFORTRAN BUILDS
  # =====================
  build-gfortran-linux-x86_64:
    name: Build (Linux, x86_64, GCC)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: x86_64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_BEFORE_ALL_LINUX: yum install -y gcc-gfortran

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-gfortran-linux-x86_64
          path: wheelhouse/*.whl

  build-gfortran-linux-aarch64:
    name: Build (Linux, aarch64, GCC)
    runs-on: ubuntu-24.04-arm
    
    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: aarch64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_BEFORE_ALL_LINUX: yum install -y gcc-gfortran

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-gfortran-linux-aarch64
          path: wheelhouse/*.whl

  build-gfortran-windows:
    name: Build (Windows, x86_64, GCC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rtools (MinGW-w64 with gfortran)
        run: |
          choco install rtools -y --no-progress --force --version=4.0.0.20220125
          echo "C:\rtools40\ucrt64\bin" >> $env:GITHUB_PATH
        shell: powershell

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pypa/cibuildwheel/Cache
          key: virtualenv-20.30.0
      
      - name: Pre-download virtualenv
        run: |
          $cacheDir = "$env:LOCALAPPDATA\pypa\cibuildwheel\Cache"
          New-Item -ItemType Directory -Force -Path $cacheDir
          $virtualenvPath = "$cacheDir\virtualenv-20.30.0.pyz"
          if (-not (Test-Path $virtualenvPath)) {
            Invoke-WebRequest -Uri "https://github.com/pypa/get-virtualenv/blob/20.30.0/public/virtualenv.pyz?raw=true" -OutFile $virtualenvPath -MaximumRedirection 10
          }
        shell: powershell

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: AMD64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_BEFORE_BUILD_WINDOWS: choco install rtools -y --no-progress && pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python -m delvewheel repair --add-path "C:\rtools40\ucrt64\bin" -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-gfortran-windows
          path: wheelhouse/*.whl

  build-gfortran-macos-arm64:
    name: Build (macOS, arm64, GCC)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Install gfortran
        run: brew install gcc

      - name: Detect gfortran path
        run: |
          GFORTRAN_BIN="$(ls "$(brew --prefix)/bin"/gfortran-* | head -n 1)"
          echo "FC=${GFORTRAN_BIN}" >> "$GITHUB_ENV"
          echo "F77=${GFORTRAN_BIN}" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: arm64
          CIBW_SKIP: "*-musllinux_*"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-gfortran-macos-arm64
          path: wheelhouse/*.whl

  # =====================
  # INTEL BUILDS
  # =====================
  build-intel-linux:
    name: Build (Linux, x86_64, Intel ifx)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2025.0'

      - name: Setup Intel pyproject
        run: cp pyproject-intel.toml pyproject.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: x86_64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_MANYLINUX_IMAGE: ${{ vars.MANYLINUX_IMAGE || 'quay.io/pypa/manylinux_2_28_x86_64' }}
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_ENVIRONMENT_LINUX: FC=$FC CC=$CC CXX=$CXX
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-intel-linux
          path: wheelhouse/*.whl

  build-intel-windows:
    name: Build (Windows, x86_64, Intel ifx + MSVC)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v5

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2025.0'

      - name: Setup Intel pyproject
        run: cp pyproject-intel.toml pyproject.toml

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pypa/cibuildwheel/Cache
          key: virtualenv-20.30.0
      
      - name: Pre-download virtualenv
        run: |
          $cacheDir = "$env:LOCALAPPDATA\pypa\cibuildwheel\Cache"
          New-Item -ItemType Directory -Force -Path $cacheDir
          $virtualenvPath = "$cacheDir\virtualenv-20.30.0.pyz"
          if (-not (Test-Path $virtualenvPath)) {
            Invoke-WebRequest -Uri "https://github.com/pypa/get-virtualenv/blob/20.30.0/public/virtualenv.pyz?raw=true" -OutFile $virtualenvPath -MaximumRedirection 10
          }
        shell: powershell

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: AMD64
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: pytest {package}/test -v
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_BEFORE_BUILD_WINDOWS: call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" && pip install delvewheel
          CIBW_ENVIRONMENT_WINDOWS: FC=ifx CC=cl CXX=cl
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python -m delvewheel repair --add-path "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\bin" -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-intel-windows
          path: wheelhouse/*.whl

  # =====================
  # PUBLISH
  # =====================
  publish:
    name: Publish to PyPI
    needs: [build-gfortran-linux-x86_64, build-gfortran-linux-aarch64, build-gfortran-windows, build-gfortran-macos-arm64, build-intel-linux, build-intel-windows]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all wheels
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish zscan-fit (gfortran)
        run: |
          pip install twine
          ls dist/
          twine upload dist/zscan_fit-${{ steps.version.outputs.VERSION }}-cp*.whl

      - name: Publish zscan-fit-intel (Intel)
        run: |
          pip install twine
          twine upload dist/zscan_fit_intel-${{ steps.version.outputs.VERSION }}-cp*.whl
