[build-system]
requires = [
    "scikit-build-core>=0.4",
    "cython>=3.0",
    "numpy>=1.20",
]
build-backend = "scikit_build_core.build"

[project]
name = "zfit"
version = "0.1.0"
description = "Z-scan fitting library for nonlinear optics"
authors = [{name = "Your Name"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "scipy>=1.0"]

[tool.scikit-build]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = {env="CMAKE_BUILD_TYPE", default="Release"}

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* pp*"
build-frontend = "build"
test-command = "pytest {package}/test -v"
test-requires = ["pytest", "scipy"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
